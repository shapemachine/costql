[project]
name = "tmdb-demo"
version = "0.1.0"
description = "TMDB Passthrough API: costQL tier-fidelity calibration demo"
requires-python = ">=3.10"
dependencies = [
    "strawberry-graphql>=0.235",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
