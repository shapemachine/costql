name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: pytest -q
      - name: conformance oracle is up to date
        run: |
          python scripts/export_conformance.py
          git diff --exit-code conformance/quotes.json
      - name: documented CLI commands still parse
        run: python scripts/check_cli_docs.py

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: wheel imports in a bare venv
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install dist/*.whl
          /tmp/bare/bin/python -c "import costql; print(costql.__version__)"
          /tmp/bare/bin/costql quote --pack packs/rickmorty_t1.json '{ character(id:"1"){ name } }'
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
