name: Release

# Tag-driven, tokenless releases via Trusted Publishing (PyPI/TestPyPI AND
# npm, both OIDC). The version is DERIVED FROM THE GIT TAG (v1.2.3 -> 1.2.3)
# and pinned into src/costql/_version.py and js/package.json at build time, so
# the tag is the single source of truth for the version.
#
# Pre-release tags -- any version with letters after the number, e.g. v0.1.0rc1
# or v0.2.0b1 -- publish ONLY to TestPyPI (a safe rehearsal). Final tags
# (vX.Y.Z, digits only) publish TestPyPI -> PyPI -> npm.
#
# Manual dispatch (fix-forward): if one leg failed after PyPI took the
# version, do NOT re-tag. Run this workflow manually with the existing tag
# (e.g. tag=v0.2.0): it rebuilds from that tag and publishes the npm leg
# only, skipping TestPyPI/PyPI entirely.
#
# One-time setup (repo owner):
#   - PyPI + TestPyPI: add a Trusted Publisher for shapemachine/costql,
#     workflow release.yml, environments "testpypi" / "pypi".
#   - npm: add a Trusted Publisher on the costql package (GitHub Actions,
#     shapemachine/costql, workflow release.yml, environment "npm",
#     allowed action: publish). No NPM_TOKEN secret needed.
#   - GitHub: create environments "testpypi", "pypi", "npm"; require manual
#     approval on "pypi" (public repo only).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish the npm leg for (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Derive version from tag and pin it
        id: ver
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          RAW="${TAG#v}"
          echo "Tag ${TAG} -> version ${RAW}"
          printf '__version__ = "%s"\n' "$RAW" > src/costql/_version.py
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          if printf '%s' "$RAW" | grep -qE '[A-Za-z]'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${RAW} is a pre-release -> TestPyPI only"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${RAW} is a final release -> TestPyPI, PyPI, npm"
          fi
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    needs: [build, testpypi]
    if: ${{ github.event_name == 'push' && needs.build.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    environment: pypi   # configure required reviewers on this environment (public repo)
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: [build, pypi]
    # Runs after PyPI on a tag push, or directly on manual dispatch (the
    # fix-forward path: PyPI already has the version, publish npm only).
    if: >-
      ${{ always() && needs.build.result == 'success'
          && needs.build.outputs.prerelease == 'false'
          && (needs.pypi.result == 'success'
              || (github.event_name == 'workflow_dispatch' && needs.pypi.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm >= 11.5 exchanges the Actions OIDC token with the registry's
      # Trusted Publisher (no NPM_TOKEN, nothing stored); provenance is
      # generated automatically on trusted publishes.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Pin version from tag
        run: npm version "${{ needs.build.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - run: npm test
      - run: npm publish --access public
